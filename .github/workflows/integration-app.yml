# Fork-only (ephraimm/designcraft `integration`; never upstreamed): builds the macOS app from
# integration (upstream main + our open PRs) as a downloadable artifact. Unsigned (ad-hoc), nothing
# published or released. Runs on GitHub's standard macos-15 runner, free for public repositories.
# Switch `uses:` to storytold/craft-common-actions/...@main once https://github.com/storytold/craft-common-actions/pull/263 lands.
name: Integration app

on:
  push:
    branches: [integration]

permissions:
  contents: read

concurrency:
  group: integration-app
  cancel-in-progress: true

jobs:
  app:
    uses: ephraimm/craft-common-actions/.github/workflows/gate.yml@42e79d293e9b15a13b90c247075b610d4e038557
    with:
      # Both free standard runners, since arm64 often waits on capacity. Each leg that runs uploads
      # designcraft-integration-<runner>. Intel builds universal, because package.sh runs the CLI
      # it just built.
      os: '["macos-15","macos-15-intel"]'
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      targets: aarch64-apple-darwin x86_64-apple-darwin
      tools: ""
      dev-debug: ""
      timeout-minutes: 180
      command: packaging/macos/package.sh --arch "$([ "$(uname -m)" = arm64 ] && echo aarch64 || echo universal)"
      artifact-name: designcraft-integration
      artifact-path: dist/release/*
